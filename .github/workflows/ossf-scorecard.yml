name: OSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: "2 22 * * 3" # once a week
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    permissions:
      contents: read # for actions/checkout
      id-token: write # for Scorecard to publish results
      security-events: write # for the SARIF upload to code scanning
    uses: open-telemetry/shared-workflows/.github/workflows/scorecard.yml@f09a36e1fa2576787fe05cbc1313ef6066918c78 # v0.23.0
